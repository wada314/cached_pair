[package]
name = "cached-pair"
version = "0.14.0"
edition = "2021"
license = "Apache-2.0"
description = "A simple pair of values, where the one can be convertible to the other."
documentation = "https://docs.rs/cached-pair/latest/cached_pair/"
repository = "https://github.com/wada314/cached_pair"
readme = "readme.md"
keywords = ["pair", "cache", "conversion", "either", "data-structure"]
categories = ["data-structures", "caching", "rust-patterns"]

[dependencies]
itertools = { version = "0.14.0", optional = true }
polonius-the-crab = { version = "0.4.2", optional = true }
derive_more = { version = "2.0.1", features = ["debug"], optional = true }
allocator-api2 = { version = "0.2.21", optional = true }

[features]
default = []
itertools = ["dep:itertools"]
multi_pair = ["dep:polonius-the-crab", "dep:derive_more", "dep:allocator-api2"]
nightly = ["allocator-api2/nightly"]
